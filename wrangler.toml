name = "llmfaucet"
main = "src/index.ts"
compatibility_date = "2026-08-24"
workers_dev = true

[triggers]
crons = ["0 * * * *", "0 0 * * *"]

[vars]
ENVIRONMENT = "development"
CATALOG_URL = ""

[[kv_namespaces]]
binding = "BUDGETS"
id = "replace-with-dev-kv-id"

[[d1_databases]]
binding = "DB"
database_name = "llmfaucet-dev"
database_id = "replace-with-dev-d1-id"
[[queues.producers]]
binding = "QUEUE"
queue = "llmfaucet-queue-dev"
[[queues.consumers]]
queue = "llmfaucet-queue-dev"
max_batch_size = 10

[env.production]
name = "llmfaucet"
workers_dev = false
routes = [{ pattern = "api.llmfaucet.dev", custom_domain = true }]
vars = { ENVIRONMENT = "production", CATALOG_URL = "" }
[[env.production.kv_namespaces]]
binding = "BUDGETS"
id = "replace-with-prod-kv-id"
[[env.production.d1_databases]]
binding = "DB"
database_name = "llmfaucet-prod"
database_id = "replace-with-prod-d1-id"
[[env.production.queues.producers]]
binding = "QUEUE"
queue = "llmfaucet-queue-prod"
[[env.production.queues.consumers]]
queue = "llmfaucet-queue-prod"
max_batch_size = 10
[env.production.triggers]
crons = ["0 * * * *", "0 0 * * *"]

[env.preview]
name = "llmfaucet-preview"
workers_dev = false
routes = [{ pattern = "api.llmfaucet-preview.dev", custom_domain = true }]
vars = { ENVIRONMENT = "preview", CATALOG_URL = "" }
[[env.preview.kv_namespaces]]
binding = "BUDGETS"
id = "replace-with-preview-kv-id"
[[env.preview.d1_databases]]
binding = "DB"
database_name = "llmfaucet-preview"
database_id = "replace-with-preview-d1-id"
[[env.preview.queues.producers]]
binding = "QUEUE"
queue = "llmfaucet-queue-preview"
[[env.preview.queues.consumers]]
queue = "llmfaucet-queue-preview"
max_batch_size = 10
[env.preview.triggers]
crons = ["0 * * * *", "0 0 * * *"]
