name: Deploy Pages
on:
  push:
    branches: [main, dev]
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Require production API endpoint configuration
        if: github.ref_name == 'main'
        run: test -n "$NEXT_PUBLIC_API_BASE_URL"
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      - name: Require preview API endpoint configuration
        if: github.ref_name == 'dev'
        run: test -n "$NEXT_PUBLIC_API_BASE_URL"
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_PREVIEW_API_BASE_URL }}
      - name: Build production Pages
        if: github.ref_name == 'main'
        run: pnpm --filter @llmfaucet/web build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_PREVIEW_API_BASE_URL: ${{ vars.NEXT_PUBLIC_PREVIEW_API_BASE_URL }}
      - name: Build preview Pages
        if: github.ref_name == 'dev'
        run: pnpm --filter @llmfaucet/web build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_PREVIEW_API_BASE_URL }}
          NEXT_PUBLIC_PREVIEW_API_BASE_URL: ${{ vars.NEXT_PUBLIC_PREVIEW_API_BASE_URL }}
      - uses: cloudflare/wrangler-action@v4
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.125.0"
          command: pages deploy apps/web/out --project-name llmfaucet --branch ${{ github.ref_name }}
